name: citeweave
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-citeweave}
      POSTGRES_USER: ${DB_USER:-citeweave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-citeweave_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
